<style>
/* Layout: one phone-sized app; framed on wide screens, full screen on phones.

:root {

  --danger: #ff6b6b;
  --strava: #fc4c02;
  --gold: #e9c46a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--outside); color: var(--ink); font: 500 16px/1.5 var(--body); display: grid; place-items: center; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }

.device { width: 100%; height: 100%; background: var(--ground); display: flex; flex-direction: column; position: relative; overflow: hidden; }

    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(circle at 50% 30%, #161a0c 0%, var(--outside) 60%);
  }
  .device { width: 390px; height: min(844px, 100%); border-radius: 46px; border: 10px solid #040404; box-shadow: 0 0 0 1px #262626, 0 50px 120px rgb(0 0 0 / 0.7); }
}

.bar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(var(--ground), rgb(18 18 18 / 0.85)); border-bottom: 1px solid transparent;
}
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-block: 2px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen::-webkit-scrollbar { width: 0; }
.enter { animation: enter 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

.logo { display: inline-flex; align-items: center; gap: 8px; color: var(--volt); background: none; border: 0; padding: 0; cursor: pointer; }
.logo-word { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; line-height: 1; }
.demo-tag { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-strong); padding: 2px 8px; border-radius: 999px; }

h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; margin-block: 12px 12px; letter-spacing: 0.01em; }

.stat-bar { display: flex; justify-content: flex-end; gap: 8px; }

label.lbl { display: block; font-weight: 800; margin-bottom: 6px; }
input[type="text"], input[type="url"] { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); }

.tag { display: inline-block; padding: 1px 8px; border-radius: 8px; background: var(--surface-2); font-weight: 800; font-size: 14px; }

.nav { flex: none; border-top: 2px solid var(--line); background: var(--ground); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; }

.overlay .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.trace { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.trace li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font-weight: 700; animation: enter 0.25s ease-out both; }
.trace .m { font-weight: 800; }
.trace .pass .m { color: var(--volt); }
.trace .fail .m { color: var(--danger); }

.spinner { width: 54px; height: 54px; border-radius: 50%; border: 6px solid var(--line-strong); border-top-color: var(--strava); animation: spin 0.8s linear infinite; }
.big-verdict { font-family: var(--display); font-weight: 700; font-size: 80px; line-height: 0.95; color: var(--volt); font-variant-numeric: tabular-nums; }
.reward-row { display: flex; gap: 10px; flex-wrap: wrap; }

.reward .v .flame { color: var(--flame); }
.reward .v .ember { color: var(--volt); }
.story { aspect-ratio: 9 / 16; max-width: 100%; max-height: 62vh; margin: 0 auto; background: var(--ground); border: 2px solid var(--line-strong); border-radius: 20px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; }
.story .w { font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; color: var(--volt); font-size: 20px; }
.story .p { font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 0.9; color: var(--volt); }
.story .l { font-family: var(--display); font-weight: 700; font-size: 30px; }
.story .q { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--muted); }

/* Landing: the evolution graphic first */
.landing { height: 100%; display: flex; flex-direction: column; padding-block: 0 24px; }
.intro { display: block; width: 100%; aspect-ratio: 13 / 9; max-height: 46%; flex: none; cursor: pointer; margin-top: 8px;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 82%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 82%, transparent); }
.landing .brand { text-align: center; display: grid; gap: 8px; padding-block: 4px 18px; margin-block: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.landing .wordmark { font-family: var(--display); font-weight: 700; font-size: 54px; letter-spacing: 0.1em; line-height: 1; color: var(--volt); }
.tagline { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }

@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes enter { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<div class="device" id="device" aria-live="polite"></div>

<script>
// "March of greatness": one figure evolves as it moves (all fours -> stooped -> upright ->
// runner), leaving a lineup of earlier selves, then breaks through the volt limit line and
// stands with arms raised. Canvas, articulated pictogram figure, ~6.5 s, tap to skip.
// Exposes window.LimitlineIntro = { mount(canvas, opts) } and is framework-free so the same
// code runs in the mini app and in the Next.js app.
(function () {
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  // Body plans. Angles in radians; limbs measured from straight down, + is forward.
  // lean: torso from vertical, + is forward. Lengths are fractions of the figure size S.
  const STAGES = [
    // 0. On all fours (about 6 million years ago)
    { lean: 1.02, headK: 0.62, torso: 0.3, arm: 0.46, leg: 0.36, tAmp: 0.3, kBase: 0.62, kAmp: 0.3, aBase: 0.32, aAmp: 0.3, aSplit: 0, eBase: 0.05, eAmp: 0.08, width: 1.0, bob: 0.006 },
    // 1. Stooped walker (about 3 million years ago)
    { lean: 0.62, headK: 0.6, torso: 0.3, arm: 0.36, leg: 0.42, tAmp: 0.36, kBase: 0.42, kAmp: 0.42, aBase: 0.18, aAmp: 0.3, aSplit: 0, eBase: 0.25, eAmp: 0.1, width: 1.0, bob: 0.008 },
    // 2. Upright, the first long-distance walker and runner (about 2 million years ago)
    { lean: 0.1, headK: 0.5, torso: 0.31, arm: 0.33, leg: 0.47, tAmp: 0.42, kBase: 0.1, kAmp: 0.6, aBase: 0.02, aAmp: 0.36, aSplit: 0, eBase: 0.3, eAmp: 0.15, width: 0.95, bob: 0.01 },
    // 3. Runner (today)
    { lean: 0.24, headK: 0.35, torso: 0.31, arm: 0.32, leg: 0.48, tAmp: 0.82, kBase: 0.5, kAmp: 1.25, aBase: 0.05, aAmp: 0.95, aSplit: 0, eBase: 1.5, eAmp: 0.15, width: 0.95, bob: 0.028 },
    // 4. Beyond the limit: arms up
    { lean: -0.06, headK: 2, torso: 0.31, arm: 0.32, leg: 0.48, tAmp: 0.18, kBase: 0.05, kAmp: 0.1, aBase: Math.PI - 0.12, aAmp: 0, aSplit: 0.36, eBase: -0.04, eAmp: 0, width: 0.95, bob: 0 },
  ];
  const LABELS = ["6M years ago", "3M years ago", "2M years ago", "Today", "You"];
  const KEYS = Object.keys(STAGES[0]);

  function stageAt(s) {
    const i = clamp(Math.floor(s), 0, STAGES.length - 2);
    const t = ease(clamp(s - i, 0, 1));
    const a = STAGES[i], b = STAGES[i + 1], out = {};
    for (const k of KEYS) out[k] = lerp(a[k], b[k], t);
    return out;
  }

  // Joint positions for a pose at hip x, gait phase ph, figure size S, ground y G.
  function pose(p, x, ph, S, G) {
    const up = (ang, len, from) => ({ x: from.x + Math.sin(ang) * len * S, y: from.y - Math.cos(ang) * len * S });
    const down = (ang, len, from) => ({ x: from.x + Math.sin(ang) * len * S, y: from.y + Math.cos(ang) * len * S });
    const hip = { x: 0, y: 0 };
    const neck = up(p.lean, p.torso, hip);
    const head = up(p.lean * p.headK, 0.11, neck);
    const shoulder = { x: lerp(hip.x, neck.x, 0.94), y: lerp(hip.y, neck.y, 0.94) };
    const legs = [0, Math.PI].map((off) => {
      const phi = ph + off;
      const thigh = p.tAmp * Math.sin(phi);
      const knee = p.kBase + p.kAmp * Math.max(0, Math.cos(phi)) * (p.kAmp > 0.9 ? 1 : 0.9);
      const k = down(thigh, p.leg * 0.5, hip);
      const f = down(thigh - knee, p.leg * 0.5, k);
      return { k, f };
    });
    const arms = [0, Math.PI].map((off, i) => {
      const phi = ph + off + Math.PI; // arms swing against legs
      const upper = p.aBase + p.aAmp * Math.sin(phi) + (i === 0 ? -p.aSplit : p.aSplit);
      const elbowBend = p.eBase + p.eAmp * Math.cos(phi);
      const e = down(upper, p.arm * 0.5, shoulder);
      const h = down(upper + elbowBend, p.arm * 0.5, e);
      return { e, h };
    });
    // Stand on the lowest foot (and, on all fours, the lowest hand).
    let low = Math.max(legs[0].f.y, legs[1].f.y);
    const handWeight = clamp((p.lean - 0.75) / 0.25, 0, 1);
    if (handWeight > 0) low = Math.max(low, lerp(low, Math.max(arms[0].h.y, arms[1].h.y), handWeight));
    const dy = G - low - p.bob * S * Math.abs(Math.sin(ph));
    const move = (pt) => ({ x: pt.x + x, y: Math.min(pt.y + dy, G) });
    return {
      hip: move(hip), neck: move(neck), head: move(head), shoulder: move(shoulder),
      legs: legs.map((l) => ({ k: move(l.k), f: move(l.f) })),
      arms: arms.map((a) => ({ e: move(a.e), h: move(a.h) })),
    };
  }

  function drawFigure(ctx, P, S, colorNear, colorFar, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const limb = (a, b, c, w, col) => {
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.stroke();
    };
    const w = S * 0.075;
    // far side first, a touch darker, for depth
    limb(P.hip, P.legs[1].k, P.legs[1].f, w, colorFar);
    limb(P.shoulder, P.arms[1].e, P.arms[1].h, w * 0.9, colorFar);
    // torso
    ctx.strokeStyle = colorNear;
    ctx.lineWidth = S * 0.12;
    ctx.beginPath();
    ctx.moveTo(P.hip.x, P.hip.y);
    ctx.lineTo(P.neck.x, P.neck.y);
    ctx.stroke();
    limb(P.hip, P.legs[0].k, P.legs[0].f, w, colorNear);
    // head
    ctx.fillStyle = colorNear;
    ctx.beginPath();
    ctx.arc(P.head.x, P.head.y, S * 0.068, 0, TAU);
    ctx.fill();
    limb(P.shoulder, P.arms[0].e, P.arms[0].h, w * 0.9, colorNear);
    ctx.restore();
  }

  function mount(canvas, opts = {}) {
    const ctx = canvas.getContext("2d");
    const colors = Object.assign({ volt: "#ceff00", ground: "#121212", ink: "#f2f2ee", muted: "#a6a6a0" }, opts.colors || {});
    const reduced = opts.reducedMotion ?? window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const DUR = 6600;
    let W = 0, H = 0, dpr = 1, start = null, raf = 0, done = false, ghosts = [], sparks = [], crossed = false, grain = null;

    function size() {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, r.width);
      H = Math.max(1, r.height);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      grain = makeGrain();
    }
    function makeGrain() {
      const g = document.createElement("canvas");
      g.width = g.height = 128;
      const gc = g.getContext("2d"), img = gc.createImageData(128, 128);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 10;
      }
      gc.putImageData(img, 0, 0);
      return ctx.createPattern(g, "repeat");
    }

    // Layout: figure size, ground, the limit line, and where each stage is reached.
    const L = () => {
      const S = Math.min(H * 0.6, W * 0.25);
      const G = H * 0.8;
      const x0 = W * 0.12, line = W * 0.8, xEnd = W * 0.9;
      return { S, G, x0, line, xEnd };
    };
    // Position and stage over time: travel to the line evolving 0 -> 3, then cross and rise to 4.
    function state(t) {
      const { x0, line, xEnd } = L();
      const travelEnd = 0.8;
      if (t < travelEnd) {
        const u = t / travelEnd;
        const x = lerp(x0, line + 4, u);
        const s = clamp(u * 3.6, 0, 3);
        return { x, s };
      }
      const u = easeOut(clamp((t - travelEnd) / (1 - travelEnd), 0, 1));
      return { x: lerp(line + 4, xEnd, u), s: 3 + u };
    }

    // Where the figure was when it was purely stage k (the lineup spacing).
    function xAtStage(k) { const { x0, line } = L(); return lerp(x0, line + 4, (k / 3.6)); }

    function frame(now) {
      if (start === null) start = now;
      const t = done ? 1 : clamp((now - start) / DUR, 0, 1);
      draw(t);
      if (t < 1 && !done) raf = requestAnimationFrame(frame);
      else { done = true; opts.onDone && opts.onDone(); }
    }

    function draw(t) {
      const { S, G, line } = L();
      ctx.clearRect(0, 0, W, H);
      // spotlight behind the finish
      const glow = ctx.createRadialGradient(line, G - S * 0.6, 0, line, G - S * 0.6, W * 0.55);
      const lit = crossed || t >= 0.8 ? 0.16 : 0.06 + 0.06 * t;
      glow.addColorStop(0, `rgba(206,255,0,${lit})`);
      glow.addColorStop(1, "rgba(206,255,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // ground
      const gg = ctx.createLinearGradient(0, 0, W, 0);
      gg.addColorStop(0, "rgba(242,242,238,0)");
      gg.addColorStop(0.15, "rgba(242,242,238,0.22)");
      gg.addColorStop(0.85, "rgba(242,242,238,0.22)");
      gg.addColorStop(1, "rgba(242,242,238,0)");
      ctx.fillStyle = gg;
      ctx.fillRect(0, G, W, 1.5);

      // the limit line
      const st = state(t);
      if (!crossed && st.x >= line) { crossed = true; burst(line, G - S * 0.55, S); }
      const lineTop = G - S * 1.25;
      ctx.save();
      ctx.strokeStyle = colors.volt;
      ctx.lineWidth = crossed ? 3 : 2;
      ctx.globalAlpha = crossed ? 1 : 0.55 + 0.3 * Math.sin(t * 40);
      if (!crossed) ctx.setLineDash([6, 6]);
      if (crossed) { ctx.shadowColor = colors.volt; ctx.shadowBlur = 18; }
      ctx.beginPath();
      ctx.moveTo(line, G + 6);
      ctx.lineTo(line, lineTop);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = crossed ? colors.volt : colors.muted;
      ctx.font = `800 ${Math.max(9, S * 0.085)}px Nunito, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("YOUR LIMIT", line, lineTop - 8);

      // ghosts: earlier selves left behind as the figure moves past each stage
      for (let k = ghosts.length; k < 4; k++) {
        if (st.s >= k + 0.5 || (k === 3 && crossed)) ghosts.push({ k, x: xAtStage(k), born: t });
        else break;
      }
      const greys = ["#3d3d3a", "#55554f", "#74746d", "#9a9a92"];
      for (const g of ghosts) {
        const P = pose(stageAt(g.k), g.x, 0.9, S, G);
        const a = clamp((t - g.born) * 6, 0, 1);
        drawFigure(ctx, P, S, greys[g.k], greys[g.k], a);
        ctx.globalAlpha = a;
        ctx.fillStyle = colors.muted;
        ctx.font = `700 ${Math.max(8, S * 0.075)}px Nunito, system-ui, sans-serif`;
        ctx.fillText(LABELS[g.k].toUpperCase(), g.x, G + Math.max(14, S * 0.16));
        ctx.globalAlpha = 1;
      }

      // the moving figure: grey while evolving, volt once it's a runner
      const p = stageAt(st.s);
      const phase = (st.x / S) * 2.3;
      const S2 = S * (1 + 0.1 * clamp(st.s - 3, 0, 1)); // the athlete grows a little as they break through
      const P = pose(p, st.x, st.s >= 3.9 ? 0.5 : phase, S2, G);
      const voltMix = clamp(st.s - 2.2, 0, 1);
      const near = mix("#bdbdb5", colors.volt, voltMix), far = mix("#8d8d86", "#8fb000", voltMix);
      if (st.s > 3) { ctx.save(); ctx.shadowColor = colors.volt; ctx.shadowBlur = 24 * (st.s - 3); drawFigure(ctx, P, S2, near, far, 1); ctx.restore(); }
      else drawFigure(ctx, P, S2, near, far, 1);
      if (st.s > 3.6) {
        ctx.globalAlpha = clamp((st.s - 3.6) * 2.5, 0, 1);
        ctx.fillStyle = colors.volt;
        ctx.font = `800 ${Math.max(8, S * 0.075)}px Nunito, system-ui, sans-serif`;
        ctx.fillText(LABELS[4].toUpperCase(), st.x, G + Math.max(14, S * 0.16));
        ctx.globalAlpha = 1;
      }

      // sparks from the break-through
      for (const sp of sparks) {
        const age = (t - sp.t0) * DUR / 1000;
        if (age < 0 || age > sp.life) continue;
        const k = 1 - age / sp.life;
        ctx.globalAlpha = k;
        ctx.fillStyle = colors.volt;
        ctx.beginPath();
        ctx.arc(sp.x + sp.vx * age, sp.y + sp.vy * age + 120 * age * age, sp.r * k, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // film grain and vignette for a premium finish
      if (grain) { ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H); }
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      lastT = t;
    }
    let lastT = 0;
    function burst(x, y, S) {
      for (let i = 0; i < 36; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
        const v = S * (0.8 + Math.random() * 1.6);
        sparks.push({ x, y: y + (Math.random() - 0.5) * S * 0.6, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 1 + Math.random() * 2.2, life: 0.5 + Math.random() * 0.6, t0: lastT });
      }
      opts.onBreak && opts.onBreak();
    }
    function mix(a, b, t) {
      const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
      return "rgb(" + pa.map((v, i) => Math.round(lerp(v, pb[i], t))).join(",") + ")";
    }

    function finish() {
      // jump to the resting frame: all ghosts, the volt figure past the line
      const { S, G } = L();
      done = true;
      cancelAnimationFrame(raf);
      crossed = true;
      ghosts = [0, 1, 2, 3].map((k) => ({ k, x: xAtStage(k), born: -1 }));
      sparks = [];
      draw(1);
      opts.onDone && opts.onDone();
      return { S, G };
    }
    function replay() {
      cancelAnimationFrame(raf);
      done = false; crossed = false; ghosts = []; sparks = []; start = null; lastT = 0;
      raf = requestAnimationFrame(frame);
    }

    size();
    const ro = new ResizeObserver(() => { size(); if (done) finish(); });
    ro.observe(canvas);
    if (reduced) finish();
    else raf = requestAnimationFrame(frame);
    canvas.addEventListener("click", () => (done ? replay() : finish()));
    return { finish, replay, destroy: () => { cancelAnimationFrame(raf); ro.disconnect(); }, _draw: draw };
  }

  window.LimitlineIntro = { mount, _pose: pose, _stageAt: stageAt };
})();

</script>

  const kind = { run: Q.trail ? "trail run" : "outdoor run", bike: "outdoor ride", swim: "pool swim", hike: "hike" }[Q.sport];
  return [`Any ${kind} of ${Q.d} or longer.`, `A longer one counts as ${Q.d}, timed on its fastest ${Q.d}.`, `Shorter than ${Q.d} won't be approved.`];
}

function limitBefore(q, at, excludeId) {
  let limit = SEEDS[q] ? SEEDS[q].value : null, efforts = SEEDS[q] ? SEEDS[q].efforts : 0;
  for (const e of state.entries) {
    if (e.status !== "verified" || e.quest !== q || e.id === excludeId || e.at >= at) continue;
    efforts += 1;
    if (limit === null || better(q, e.value, limit)) limit = e.value;
  }
  return { limit, efforts };
}
function evaluate(q, value, at, excludeId) {
  const b = limitBefore(q, at, excludeId);
  const percent = b.limit === null ? null : Math.round(((QUESTS[q].measure === "time" ? b.limit - value : value - b.limit) / b.limit) * 1000) / 10;
  const beat = percent !== null && percent > 0, doubled = beat && b.efforts >= EMBERS.minEfforts;
  return { limit: b.limit, efforts: b.efforts, percent, beat, doubled, embers: EMBERS.base * (doubled ? EMBERS.multiplier : 1) };
}
const currentLimit = (q) => limitBefore(q, Infinity);
function recomputeAll() {
  for (const e of state.entries.filter((x) => x.status === "verified").sort((a, b) => a.at - b.at)) {
    const r = evaluate(e.quest, e.value, e.at, e.id);
    Object.assign(e, { percent: r.percent, beat: r.beat, doubled: r.doubled, embers: r.embers });
  }
}
function weekKey(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function streak() {
  const weeks = new Set(state.entries.filter((e) => e.status === "verified").map((e) => weekKey(e.at)));
  const thisWeek = weekKey(NOW), active = weeks.has(thisWeek);
  let cursor = active ? thisWeek : weekKey(thisWeek - 3 * DAY), n = 0;
  while (weeks.has(cursor)) { n += 1; cursor = weekKey(cursor - 3 * DAY); }
  return { weeks: n, active };
}
const balance = () =>
  state.entries.filter((e) => e.status === "verified").reduce((a, e) => a + e.embers, 0) +
  state.posts.filter((p) => p.status === "approved").reduce((a, p) => a + p.embers, 0) -
  state.redemptions.reduce((a, r) => a + r.price, 0);

const TYPES = { run: ["Run", "TrailRun"], bike: ["Ride", "GravelRide", "MountainBikeRide"], swim: ["Swim"], hike: ["Hike"] };
const INDOOR = { VirtualRun: "run", VirtualRide: "bike" };
function stravaCheck(q, a) {
  const Q = QUESTS[q], steps = [];
  const pass = (t) => steps.push(["pass", t]);
  const reject = (reason, t) => (steps.push(["fail", t]), { kind: "reject", reason, steps });
  const founder = (t, value) => (steps.push(["hold", t]), { kind: "founder", note: t, value, steps });
  if (a.other) return reject("not_own", "Recorded by a different Strava account");
  pass("Your own Strava account");
  if (a.manual) return reject("manual_entry", "Typed in on Strava, not recorded");
  pass("Recorded with a watch or phone");
  if (INDOOR[a.type] === Q.sport) return reject("not_outdoor", "Strava says " + a.type + ": indoor");
  if (!TYPES[Q.sport].includes(a.type)) return reject("wrong_sport", a.type === "EBikeRide" ? "E-bike rides don't count" : "It's a " + a.kindLabel + ", not a " + SPORTS[Q.sport].label.toLowerCase());
  if (Q.trail && a.type !== "TrailRun") return reject("not_trail", "Strava says road run, not trail");
  pass("Right sport for " + Q.label);
  if (Q.sport !== "swim" && a.trainer) return reject("not_outdoor", "Marked as indoor on Strava");
  if (Q.sport === "swim" && a.gps) return founder("Has GPS, so it may be open water. Quests are pool swims.");
  pass(Q.sport === "swim" ? "Pool swim" : "Outdoors");
  if (a.at < SIGNED_UP) return reject("before_signup", "Recorded before you signed up");
  pass("Recorded after you signed up");
  let value;
  if (Q.measure === "power") {
    if (a.minutes < 20) return reject("not_completed", a.minutes + " min, short of 20 min");
    pass(a.minutes + " min ride");
    if (!a.power) return reject("needs_power", "No power meter on this ride");
    value = a.best20;
    pass("Best 20 minutes of power: " + value + " W");
  } else if (Q.measure === "elevation") {
    if (a.up < Q.minUp) return reject("not_completed", a.up.toLocaleString("en-GB") + " m up, short of " + Q.minUp.toLocaleString("en-GB") + " m");
    value = a.up;
    pass("Climbed " + a.up.toLocaleString("en-GB") + " m");
  } else {
    if (a.meters < Q.meters - (Q.sport === "swim" ? 1 : 0)) return reject("not_completed", (Q.sport === "swim" ? a.meters + " m" : km(a.meters)) + ", short of " + Q.d);
    pass((Q.sport === "swim" ? a.meters + " m" : km(a.meters)) + ", at least " + Q.d);
    value = a.fastest && a.fastest[Q.meters];
    if (!value) return founder("No fastest " + Q.d + " found in it");
    pass("Fastest " + Q.d + " inside it: " + fmtTime(value));
  }
  const implausible = Q.measure === "time" ? value < Q.plausible : value > Q.plausible;
  if (implausible) return founder("Beyond what's humanly likely, so the founder looks", value);
  return { kind: "value", value, steps };
}

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function parseLink(v) {
  const s = v.trim(), m = s.match(/^https?:\/\/(www\.)?strava\.com\/activities\/(\d{1,20})\/?$/i);
  if (m) return { id: m[2] };
  if (/^https:\/\/strava\.app\.link\/\S+$/i.test(s)) return { short: true };
  return null;
}
const isInstagram = (v) => /^https:\/\/(www\.)?instagram\.com\/(p|reel|reels|stories)\/[\w.\-/]+\/?(\?\S*)?$/i.test(v.trim());
function submitLink(raw) {
  state.linkDraft = raw;
  const p = parseLink(raw);
  if (!p) { state.linkError = "That's not a Strava activity link"; return render(); }
  if (p.short) { state.linkError = "Share links need the real Strava connection. In this demo, tap one of your activities below."; return render(); }
  const a = actById(p.id);
  if (!a) { state.linkError = "That activity isn't in this demo's sample Strava. Tap one of your activities below."; return render(); }
  if (state.entries.find((e) => e.activity === a.id)) { state.linkError = "Already submitted today"; return render(); }
  state.linkError = ""; state.linkDraft = "";
  const id = "e" + Math.random().toString(36).slice(2, 9);
  const entry = { id, quest: state.quest, activity: a.id, status: "waiting", value: null, at: a.at, percent: null, beat: null, embers: 0, seen: false, submitted: Date.now(), by: null };
  state.entries.push(entry);
  if (!state.strava) { state.flash = { text: "Got it! Waiting for the founder's check. Connect Strava to get results in seconds." }; state.tab = "quests"; state.quest = null; return render(); }
  const before = streak(), r = stravaCheck(state.quest, a);
  let steps = r.steps;
  if (r.kind === "reject") Object.assign(entry, { status: "rejected", reason: r.reason, by: "strava", seen: true });
  else if (r.kind === "founder") entry.note = r.note;
  else {
    const ev = evaluate(state.quest, r.value, a.at, id);
    if (ev.percent !== null && ev.percent > CONFIRM_ABOVE) {
      entry.note = fmtVal(state.quest, r.value) + " is " + fmtPct(ev.percent) + " beyond your limit. The founder double-checks big jumps.";
      steps = [...steps, ["hold", fmtPct(ev.percent) + " beyond your limit: the founder double-checks big jumps"]];
    } else {
      Object.assign(entry, { status: "verified", value: r.value, by: "strava" });
      recomputeAll();
      steps = [...steps, ["pass", ev.percent === null ? "Sets your first limit" : fmtPct(ev.percent) + (ev.beat ? " beyond your limit" : " vs your limit")]];
    }
  }
  const after = streak();
  playChecking(steps, { type: "result", id, streakUp: !before.active && after.active ? after.weeks : 0 });
}
function submitPost(raw) {
  state.igDraft = raw;
  if (!isInstagram(raw)) { state.igError = "That's not an Instagram post link. In Instagram: … → Copy link."; return render(); }
  if (state.posts.find((p) => p.link === raw.trim())) { state.igError = "You've already submitted this post"; return render(); }
  const c = contentById(state.content);
  state.posts.push({ id: "p" + Math.random().toString(36).slice(2, 9), cid: c.id, link: raw.trim(), status: "review", embers: c.embers });
  state.igDraft = ""; state.igError = "";
  state.overlay = { type: "posted", cid: c.id };
  render();
}
function playChecking(steps, then) {
  state.overlay = { type: "checking", steps, shown: 0 };
  render();
  const tick = () => {
    if (!state.overlay || state.overlay.type !== "checking") return;
    if (state.overlay.shown < steps.length) { state.overlay.shown += 1; render(); setTimeout(tick, reduced ? 60 : 240); }
    else setTimeout(() => { state.overlay = then; render(true); }, reduced ? 100 : 450);
  };
  setTimeout(tick, reduced ? 50 : 380);
}
const toTop = () => $dev.querySelector(".screen")?.scrollTo(0, 0);

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case "login": state.screen = state.name ? "app" : "welcome"; render(); break;
    case "tab": Object.assign(state, { tab: v, flash: null, linkError: "", igError: "", quest: v === "quest" ? state.quest : null, content: null }); render(); toTop(); break;
    case "seg": state.seg = v; state.flash = null; render(); break;
    case "filter": state.filter = v; render(); break;
    case "quest": Object.assign(state, { tab: "quest", quest: v, flash: null, linkError: "", linkDraft: "", showOther: false }); render(); toTop(); break;
    case "content": Object.assign(state, { tab: "content", content: v, flash: null, igError: "", igDraft: "" }); render(); toTop(); break;
    case "pick": state.linkDraft = "https://www.strava.com/activities/" + v; state.linkError = ""; render(); document.getElementById("link-form")?.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }); break;
    case "other": state.showOther = !state.showOther; render(); break;
    case "igsample": state.igDraft = "https://www.instagram.com/reel/C" + Math.random().toString(36).slice(2, 11) + "/"; state.igError = ""; render(); break;
    case "allseen": state.entries.forEach((e) => { e.seen = true; }); render(); break;
    case "seen": { const e = state.entries.find((x) => x.id === v); if (e) e.seen = true; render(); break; }
    case "share": state.overlay = { type: "share", id: v }; render(); break;
    case "close": state.overlay = null; render(); break;
    case "close-posted": Object.assign(state, { overlay: null, tab: "quests", seg: "content", content: null, flash: null }); render(true); toTop(); break;
    case "continue": {
      const e = state.entries.find((x) => x.id === state.overlay.id);
      Object.assign(state, { overlay: null, tab: "quests", quest: null, seg: "training" });
      state.flash = e.status === "verified" ? null : e.status === "rejected" ? { tone: "badn", text: "Checked with Strava: not approved. " + REASONS[e.reason] + "." } : { text: "This one needs a quick check by the founder." };
      render(true); toTop(); break;
    }
    case "sport": state.sport = v; render(); break;
    case "redeem": {
      const item = SHOP.find((i) => i.id === v);
      if (balance() >= item.price && state.stock[v] > 0) { state.stock[v] -= 1; state.redemptions.push({ id: v, name: item.name, price: item.price }); state.flash = { where: "shop", text: "Requested! " + (item.sponsor ? SPONSORS[item.sponsor].name + " ships it to you." : "The founder will hand it over.") }; }
      render(true); break;
    }
    case "strava": state.strava = v === "on"; render(); break;
    case "approve": { const e = state.entries.find((x) => x.id === v), fv = founderValue(e); Object.assign(e, { status: "verified", value: fv.value, by: "founder", seen: false, note: null }); recomputeAll(); Object.assign(state, { tab: "quests", seg: "training", flash: { text: "Approved by the founder. Your result is below." } }); render(true); break; }
    case "reject": { const e = state.entries.find((x) => x.id === v), fv = founderValue(e); Object.assign(e, { status: "rejected", reason: fv.reason || "not_completed", by: "founder" }); recomputeAll(); render(); break; }
    case "papprove": { const p = state.posts.find((x) => x.id === v); p.status = "approved"; Object.assign(state, { tab: "quests", seg: "content", flash: { text: "Post approved: +" + p.embers + " embers." } }); render(true); break; }
    case "preject": { const p = state.posts.find((x) => x.id === v); p.status = "rejected"; p.reason = "no_tag"; render(); break; }
    case "reset": try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } freshState(); render(); break;
    case "logout": state.screen = "landing"; state.tab = "quests"; render(); break;
  }
});
document.addEventListener("change", (ev) => { const el = ev.target; if (el.dataset && el.dataset.act === "toggle") { state[el.dataset.v] = el.checked; render(); } });
document.addEventListener("input", (ev) => { if (ev.target.id === "link") state.linkDraft = ev.target.value; if (ev.target.id === "ig") state.igDraft = ev.target.value; });
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "welcome-form") { state.name = document.getElementById("name").value.trim().slice(0, 40) || "Alex M."; Object.assign(state, { screen: "app", tab: "quests" }); render(); }
  if (ev.target.id === "link-form") submitLink(document.getElementById("link").value);
  if (ev.target.id === "ig-form") submitPost(document.getElementById("ig").value);
});

function start(data) {
  state = (data && data.state) || load() || freshState();
  if (state.overlay && state.overlay.type === "checking") state.overlay = null;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state: { ...state, overlay: state.overlay && state.overlay.type === "checking" ? null : state.overlay } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
