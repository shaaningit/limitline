<title>LIMITLINE Mini App</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one phone-sized app; framed on wide screens, full screen on phones.
   LIMITLINE premium (founder, Nov 4): matte black, one volt accent, hairlines and glass,
   a wide athletic display face (Archivo Expanded) and a clean text face (Manrope). */
:root {
  --ground: #0c0c0c;
  --outside: #060606;
  --surface: #141414;
  --surface-2: #1b1b1b;
  --glass: rgb(255 255 255 / 0.045);
  --glass-hover: rgb(255 255 255 / 0.08);
  --line: rgb(255 255 255 / 0.08);
  --line-strong: rgb(255 255 255 / 0.14);
  --ink: #f4f4f0;
  --muted: #9a9a94;
  --volt: #ceff00;
  --volt-soft: rgb(206 255 0 / 0.1);
  --volt-line: rgb(206 255 0 / 0.28);
  --on-volt: #0c0c0c;
  --flame: #ff9f1a;
  --danger: #ff6b6b;
  --strava: #fc4c02;
  --gold: #d9b968;
  --display: "Archivo", "Arial Black", sans-serif;
  --body: "Manrope", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--outside); color: var(--ink); font: 500 16px/1.5 var(--body); display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--volt); outline-offset: 3px; }

.device { width: 100%; height: 100%; background: var(--ground); display: flex; flex-direction: column; position: relative; overflow: hidden; }
@media (min-width: 520px) {
  body {
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(circle at 50% 30%, #12150a 0%, var(--outside) 62%);
  }
  .device { width: 390px; height: min(844px, 100%); border-radius: 48px; border: 9px solid #030303; box-shadow: 0 0 0 1px #222, 0 60px 140px rgb(0 0 0 / 0.75); }
}

.bar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 16px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-block: 4px 32px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.screen::-webkit-scrollbar { width: 0; }
.enter { animation: enter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
.logo-word { font-family: var(--display); font-stretch: 125%; font-weight: 800; letter-spacing: 0.04em; line-height: 1; }
.demo-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-strong); padding: 3px 9px; border-radius: 999px; }

h1, h2, h3 { font-family: var(--display); font-stretch: 112%; font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; margin-block: 16px 14px; }
h2 { font-size: 18px; margin-block: 30px 12px; letter-spacing: 0; }
h3 { font-size: 20px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.num { font-family: var(--display); font-stretch: 100%; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.ok { color: var(--volt); }
.bad { color: var(--danger); }

/* Buttons: slim, sentence case. Volt for the main action, glass for the rest. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line-strong);
  background: var(--glass); color: var(--ink); font-weight: 700; font-size: 15px; letter-spacing: -0.005em;
  cursor: pointer; transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.btn:hover:not(:disabled) { background: var(--glass-hover); border-color: rgb(255 255 255 / 0.22); }
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-volt { background: var(--volt); border-color: transparent; color: var(--on-volt); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.45), 0 10px 30px -12px rgb(206 255 0 / 0.55); }
.btn-volt:hover:not(:disabled) { background: #d8ff33; border-color: transparent; }
.btn-google { background: #f4f4f0; border-color: transparent; color: #111; }
.btn-google:hover:not(:disabled) { background: #fff; border-color: transparent; }
.btn-strava { background: var(--strava); border-color: transparent; color: #fff; }
.btn-ig { background: linear-gradient(100deg, #f58529, #dd2a7b 45%, #8134af); border-color: transparent; color: #fff; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; font-size: 14px; padding: 0 16px; border-radius: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; cursor: pointer; font-size: 14px; }
.link:hover { color: var(--ink); }

.stat-bar { display: flex; justify-content: flex-end; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--glass); font-size: 17px; cursor: pointer; color: var(--ink); }
.pill .flame { color: var(--flame); display: inline-flex; }
.pill.cold .flame { color: var(--muted); }
.pill .ember { color: var(--volt); display: inline-flex; }
.bump { animation: bump 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
.seg button { min-height: 38px; border-radius: 10px; border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; min-height: 34px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.2s ease; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

.card { background: linear-gradient(180deg, #161616, #111); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-block: 12px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--glass); margin-block: 10px; font-weight: 600; font-size: 15px; }
.note.warm { border-color: rgb(255 159 26 / 0.45); background: rgb(255 159 26 / 0.06); }
.note.warm svg { color: var(--flame); flex: none; }
.note.badn { border-color: rgb(255 107 107 / 0.45); }
.hero { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 56px; line-height: 1; color: var(--volt); font-variant-numeric: tabular-nums; margin-block: 8px 4px; letter-spacing: -0.02em; }
.pop { animation: pop 0.5s cubic-bezier(0.2, 1.2, 0.4, 1) both; transform-origin: left center; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--volt-soft); border: 1px solid var(--volt-line); color: var(--volt); font-size: 13px; font-weight: 700; }

/* Sponsored: a premium card with a gold hairline */
.sponsor {
  position: relative; overflow: hidden; border-radius: 22px; padding: 20px 18px 18px; margin-block: 12px;
  background: radial-gradient(120% 90% at 100% 0%, rgb(217 185 104 / 0.14), transparent 55%), linear-gradient(180deg, #171615, #101010);
  border: 1px solid rgb(217 185 104 / 0.22);
}
.sponsor::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.sponsor .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.brandmark { font-family: var(--display); font-stretch: 125%; font-weight: 800; letter-spacing: 0.18em; font-size: 13px; color: var(--ink); }
.sample { white-space: nowrap; flex: none; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); border: 1px solid rgb(217 185 104 / 0.4); padding: 3px 8px; border-radius: 999px; }
.sponsor h3 { font-size: 24px; margin-bottom: 8px; }
.prize { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--gold); margin-bottom: 16px; font-size: 15px; }
.scroller { display: grid; grid-auto-flow: column; grid-auto-columns: 86%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -2px; padding-inline: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { scroll-snap-align: start; margin-block: 4px 14px; }

.quests { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.quest {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 14px 14px 12px;
  border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, #151515, #111); cursor: pointer;
  transition: transform 0.12s ease, border-color 0.2s ease;
}
.quest:hover { border-color: var(--line-strong); }
.quest:active { transform: scale(0.99); }
.sport { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 14px; background: var(--volt-soft); border: 1px solid var(--volt-line); color: var(--volt); flex: none; }
.sport.ig { background: linear-gradient(135deg, rgb(245 133 41 / 0.18), rgb(129 52 175 / 0.22)); border-color: rgb(221 42 123 / 0.4); color: #ff6fb0; }
.quest-text { display: grid; gap: 1px; min-width: 0; }
.quest-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; letter-spacing: -0.005em; }
.progress { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.track { flex: 1; height: 4px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
.fill { display: block; height: 100%; border-radius: 999px; background: var(--volt); box-shadow: 0 0 10px rgb(206 255 0 / 0.5); }
.plabel { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; letter-spacing: 0.04em; }
.chev { color: var(--muted); opacity: 0.6; }
.group-h { display: flex; align-items: baseline; gap: 10px; margin-block: 26px 12px; }
.group-h h2 { margin: 0; }
.group-h .count { color: var(--muted); font-weight: 600; font-size: 13px; }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rows li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows li.me { font-weight: 700; }
.rows .grow { min-width: 0; flex: 1; }
.rank { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 15px; }
.rank.top { background: var(--volt-soft); border-color: var(--volt-line); color: var(--volt); }
.whorow { display: flex; align-items: center; gap: 12px; min-width: 0; }

label.lbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
input[type="text"], input[type="url"] { width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); transition: border-color 0.2s ease; }
input[type="text"]:focus, input[type="url"]:focus { border-color: var(--volt-line); outline: none; box-shadow: 0 0 0 4px rgb(206 255 0 / 0.08); }
.rules { margin: 0 0 20px; padding-left: 20px; display: grid; gap: 8px; color: #cfcfca; font-size: 15px; }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.act { width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color 0.2s ease; }
.act:hover { border-color: var(--line-strong); }
.act.used { opacity: 0.4; }
.act .ico { color: var(--strava); display: inline-flex; justify-content: center; }
.act b { display: block; font-size: 15px; font-weight: 700; }
.act span { font-size: 13px; color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); font-weight: 600; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--volt); }
.avatar-lg { display: flex; align-items: center; gap: 14px; margin-block: 18px; }
.steps-ig { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 12px; }
.steps-ig li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: 15px; }
.steps-ig .n { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-strong); font-family: var(--display); font-weight: 700; font-size: 13px; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-weight: 700; font-size: 13px; }

/* Bottom bar: icons only, glass, a volt dot under the active tab */
.nav { flex: none; border-top: 1px solid var(--line); background: rgb(12 12 12 / 0.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; }
.nav button { position: relative; flex: 1; min-height: 50px; border-radius: 12px; border: 0; background: none; color: #6f6f6a; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s ease; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"]::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 8px var(--volt); }
.avatar { display: inline-flex; width: 30px; height: 30px; padding: 2px; border-radius: 50%; border: 1.5px solid transparent; }
.nav button[aria-current="page"] .avatar { border-color: var(--ink); }

.overlay { position: absolute; inset: 0; background: var(--ground); z-index: 5; display: flex; flex-direction: column; padding: 30px max(22px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); animation: enter 0.25s ease-out; }
.overlay .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.trace { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.trace li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-weight: 600; font-size: 15px; animation: enter 0.25s ease-out both; }
.trace .m { font-weight: 800; }
.trace .pass .m { color: var(--volt); }
.trace .fail .m { color: var(--danger); }
.trace .hold .m { color: var(--flame); }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--strava); animation: spin 0.8s linear infinite; }
.big-verdict { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 76px; line-height: 0.95; color: var(--volt); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.reward-row { display: flex; gap: 10px; flex-wrap: wrap; }
.reward { flex: 1; min-width: 130px; border: 1px solid var(--line-strong); border-radius: 18px; padding: 14px 16px; background: var(--glass); }
.reward .t { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.reward .v { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 30px; margin-top: 4px; }
.reward .v .flame { color: var(--flame); display: inline-flex; }
.reward .v .ember { color: var(--volt); display: inline-flex; }
.story { aspect-ratio: 9 / 16; max-width: 100%; max-height: 62vh; margin: 0 auto; background: radial-gradient(90% 60% at 50% 45%, rgb(206 255 0 / 0.12), transparent), var(--ground); border: 1px solid var(--line-strong); border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; }
.story .w { display: flex; align-items: center; gap: 8px; }
.story .p { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 76px; line-height: 0.9; color: var(--volt); letter-spacing: -0.03em; }
.story .l { font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: 26px; }
.story .q { font-weight: 600; font-size: 16px; color: var(--muted); }

/* Opening screen: cinematic graphic, the brand, then the way in */
.landing { height: 100%; display: flex; flex-direction: column; }
.hero-stage { position: relative; flex: none; }
.intro { display: block; width: 100%; aspect-ratio: 1 / 0.92; max-height: 50vh; cursor: pointer; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 80%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 80%, transparent); }
.hero-top { position: absolute; inset: 18px 18px auto; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.landing .copy { padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; margin-top: -6px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0; }
.headline { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: clamp(28px, 8.6vw, 35px); line-height: 0.98; letter-spacing: -0.02em; margin: 0; }
.headline .volt { color: var(--volt); }
.landing .copy p.sub { color: var(--muted); margin: 0; font-size: 15px; max-width: 32ch; }
.auth { margin-top: auto; padding: 20px max(24px, env(safe-area-inset-right, 0px)) 26px max(24px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.auth .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.legal { margin: 6px 0 0; text-align: center; font-size: 12px; color: #6f6f6a; }
.welcome { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-block: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

@keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 70% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes enter { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ================= v3: depth and motion (founder, Nov 5: "feel like Flutter, depth, touch") ================= */

/* Opening film */
.film { position: relative; height: 100%; overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y proximity; scrollbar-width: none; }
.film::-webkit-scrollbar { display: none; }
.film .stage { position: sticky; top: 0; height: 100%; overflow: hidden; }
.film canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.film .snap { height: 100%; scroll-snap-align: start; }
.film .snap0 { height: 0; scroll-snap-align: start; }
.chapters { position: absolute; inset: auto 0 0; padding: 0 max(26px, env(safe-area-inset-right, 0px)) calc(34px + env(safe-area-inset-bottom, 0px)) max(26px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.chapter { position: absolute; inset: auto 26px calc(64px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; will-change: transform, opacity, filter; }
.chapter .num-row { display: flex; align-items: center; gap: 10px; }
.chapter .roman { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: 12px; letter-spacing: 0.2em; color: var(--volt); }
.chapter .rule { height: 1px; width: 36px; background: var(--volt-line); }
.chapter h2 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: clamp(30px, 9vw, 38px); line-height: 1; letter-spacing: -0.02em; margin: 0; }
.chapter h2 .volt { color: var(--volt); }
.chapter p { margin: 0; color: #bdbdb7; font-size: 15px; max-width: 34ch; }
.chapter blockquote { margin: 0; font-family: var(--display); font-stretch: 100%; font-weight: 600; font-style: italic; font-size: clamp(25px, 7.4vw, 30px); line-height: 1.15; letter-spacing: -0.01em; }
.chapter cite { font-style: normal; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

    }
    const readScroll = () => {
      const max = scroller.scrollHeight - scroller.clientHeight;
      target = max > 0 ? (scroller.scrollTop / max) * (N - 1) : 0;
    };

    function drawRidge(h, baseY, amp, fill, rim, rimAlpha) {
      const n = h.length - 1;
      ctx.beginPath();
      ctx.moveTo(-10, H + 10);
      for (let i = 0; i <= n; i++) ctx.lineTo((i / n) * (W + 20) - 10, baseY - h[i] * amp);
      ctx.lineTo(W + 10, H + 10);
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      if (rimAlpha > 0.01) {
        ctx.save(); ctx.globalAlpha = rimAlpha; ctx.strokeStyle = rim; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i <= n; i++) { const x = (i / n) * (W + 20) - 10, y = baseY - h[i] * amp; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke(); ctx.restore();
      }
    }
    const ridgeY = (h, baseY, amp, x) => { const n = h.length - 1, f = ((x + 10) / (W + 20)) * n, i = clamp(Math.floor(f), 0, n - 1), t = f - i; return baseY - lerp(h[i], h[i + 1], t) * amp; };

    function draw(time, dt) {
      const S = Math.min(H * 0.26, W * 0.24), G = H * 0.66;
      ctx.clearRect(0, 0, W, H);
      const dawn = bell(c, 3, 0.95), lineCh = bell(c, 4, 0.78), fireCh = clamp(1 - c * 1.05, 0, 1);

      // Sky: black, warming at the stoic dawn, volt-tinted at the line.
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#040404");
      sky.addColorStop(0.55, `rgba(${Math.round(lerp(8, 34, dawn))},${Math.round(lerp(8, 20, dawn) + lineCh * 6)},${Math.round(8 + lineCh * 0)},1)`);
      sky.addColorStop(1, `rgba(${Math.round(lerp(12, 60, dawn))},${Math.round(lerp(12, 32, dawn) + lineCh * 10)},${Math.round(lerp(12, 10, dawn))},1)`);
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

      // Stars, drifting with scroll at their own depth.
      const starA = 0.85 * (1 - dawn * 0.85) * (1 - smooth(4.4, 5, c) * 0.4);
      for (const s of stars) {
        const tw = 0.55 + 0.45 * Math.sin(time * 0.0012 * (1 + s.d) + s.tw);
        ctx.globalAlpha = starA * tw * s.d;
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.arc(s.x * W, ((s.y * H - c * 26 * s.d) % H + H) % H, s.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // IV Stillness: the sun rising behind the mountains.
      const peakX = (peakI / (ridges[2].length - 1)) * (W + 20) - 10;
      if (dawn > 0.01) {
        // the sun rises right behind the peak, so the figure stands against it
        const sunY = lerp(H * 0.92, H * 0.47, smooth(2.2, 3.15, c)), sunR = H * 0.075;
        const halo = ctx.createRadialGradient(peakX, sunY, 0, peakX, sunY, H * 0.8);
        halo.addColorStop(0, `rgba(255,220,160,${0.55 * dawn})`); halo.addColorStop(0.18, `rgba(255,170,80,${0.22 * dawn})`); halo.addColorStop(1, "rgba(255,140,40,0)");
        ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
        const disc = ctx.createRadialGradient(peakX, sunY, 0, peakX, sunY, sunR);
        disc.addColorStop(0, `rgba(255,248,232,${dawn})`); disc.addColorStop(0.85, `rgba(255,236,200,${dawn})`); disc.addColorStop(1, "rgba(255,220,170,0)");
        ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(peakX, sunY, sunR, 0, TAU); ctx.fill();
      }

      // Mountains: three ridges in parallax, rising for the stoic chapter.
      const rise = smooth(1.9, 3, c) * (1 - smooth(3.35, 3.85, c));
      const layers = [
        { h: ridges[0], base: H * 0.6, amp: H * 0.2, depth: 0.35, fill: "#0b0b0b" },
        { h: ridges[1], base: H * 0.7, amp: H * 0.22, depth: 0.6, fill: "#090909" },
        { h: ridges[2], base: H * 0.82, amp: H * 0.3, depth: 1, fill: "#060606" },
      ];
      for (const L of layers) {
        const off = (1 - Math.max(rise, 0.12 * L.depth * (1 - smooth(3.35, 3.85, c)))) * H * 0.62 * L.depth + (c - 3) * 10 * L.depth;
        if (off < H * 0.6) drawRidge(L.h, L.base + off, L.amp, L.fill, "#ffc27a", dawn * (0.15 + 0.35 * L.depth));
        L.off = off;
      }
      // The lone figure on the front peak, still, facing the light.
      const stoic = bell(c, 3, 0.75);
      if (stoic > 0.01) {
        const L = layers[2], px = peakX, py = ridgeY(L.h, L.base + L.off, L.amp, px), s2 = S * 0.9;
        ctx.save(); ctx.shadowColor = "rgba(255,200,120,0.95)"; ctx.shadowBlur = 10 * stoic;
        figure(ctx, pose(STILL, px, 0, s2, py + 2), s2, "#050505", "#050505", stoic);
        ctx.restore();
      }

      // Ground line for the march, the run and the line.
      const groundA = Math.max(bell(c, 1, 1.1), bell(c, 2, 1), bell(c, 4, 1.1)) * (1 - dawn);
      if (groundA > 0.01) {
        const gg = ctx.createLinearGradient(0, 0, W, 0);
        gg.addColorStop(0, "rgba(244,244,240,0)"); gg.addColorStop(0.2, `rgba(244,244,240,${0.22 * groundA})`); gg.addColorStop(0.8, `rgba(244,244,240,${0.22 * groundA})`); gg.addColorStop(1, "rgba(244,244,240,0)");
        ctx.fillStyle = gg; ctx.fillRect(0, G, W, 1.5);
      }

      // I Fire: a campfire, two ancestors in its light, embers rising and turning volt.
      if (fireCh > 0.01) {
        const fx = W * 0.5, fy = G;
        const glow = ctx.createRadialGradient(fx, fy - S * 0.2, 0, fx, fy - S * 0.2, H * 0.55);
        glow.addColorStop(0, `rgba(255,170,60,${0.42 * fireCh})`); glow.addColorStop(0.35, `rgba(255,110,20,${0.12 * fireCh})`); glow.addColorStop(1, "rgba(255,90,0,0)");
        ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
        for (const side of [-1, 1]) {
          const ax = fx + side * S * 1.05;
          ctx.save(); ctx.shadowColor = `rgba(255,150,60,${0.8 * fireCh})`; ctx.shadowBlur = 14;
          const P = pose({ ...STAGES[1], tAmp: 0.08, aAmp: 0.05, lean: 0.75 }, ax, side > 0 ? 2.4 : 0.6, S * 0.85, fy);
          // face the fire
          if (side > 0) { for (const k of ["hip", "neck", "head", "shoulder"]) P[k].x = ax - (P[k].x - ax); for (const l of P.legs) { l.k.x = ax - (l.k.x - ax); l.f.x = ax - (l.f.x - ax); } for (const a of P.arms) { a.e.x = ax - (a.e.x - ax); a.h.x = ax - (a.h.x - ax); } }
          figure(ctx, P, S * 0.85, "#16110c", "#100c08", fireCh);
          ctx.restore();
        }
        // logs
        ctx.save(); ctx.globalAlpha = fireCh; ctx.strokeStyle = "#1a1410"; ctx.lineCap = "round"; ctx.lineWidth = S * 0.07;
        ctx.beginPath(); ctx.moveTo(fx - S * 0.32, fy); ctx.lineTo(fx + S * 0.26, fy - S * 0.1); ctx.moveTo(fx + S * 0.32, fy); ctx.lineTo(fx - S * 0.26, fy - S * 0.1); ctx.stroke(); ctx.restore();
        // flames
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        for (let k = 0; k < 6; k++) {
          const sw = Math.sin(time * 0.006 + k * 1.7) * S * 0.05, hh = S * (0.42 + 0.22 * Math.sin(time * 0.009 + k * 2.3)) * (k === 2 || k === 3 ? 1.25 : 0.85) * fireCh;
          const bx = fx + (k - 2.5) * S * 0.08, bw = S * 0.13;
          const fg = ctx.createLinearGradient(0, fy, 0, fy - hh);
          fg.addColorStop(0, "rgba(255,240,200,0.9)"); fg.addColorStop(0.35, "rgba(255,170,40,0.7)"); fg.addColorStop(1, "rgba(255,70,0,0)");
          ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(bx - bw, fy - 2);
          ctx.quadraticCurveTo(bx - bw * 0.6 + sw, fy - hh * 0.55, bx + sw * 1.6, fy - hh);
          ctx.quadraticCurveTo(bx + bw * 0.6 + sw, fy - hh * 0.55, bx + bw, fy - 2); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      // embers: always a few drifting; a stream from the fire in chapter I
      if (!reduced) {
        const rate = 0.05 + fireCh * 0.9;
        if (Math.random() < rate * dt * 0.06) embers.push({ x: fireCh > 0.2 ? W * 0.5 + (Math.random() - 0.5) * S * 0.4 : Math.random() * W, y: fireCh > 0.2 ? G - S * 0.2 : H + 4, vx: (Math.random() - 0.5) * 0.02, vy: -(0.025 + Math.random() * 0.05), life: 0, max: 2200 + Math.random() * 2600, r: 0.6 + Math.random() * 1.6, ph: Math.random() * TAU });
      }
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      embers = embers.filter((e) => (e.life += dt) < e.max && e.y > -10);
      for (const e of embers) {
        e.x += (e.vx + Math.sin(time * 0.002 + e.ph) * 0.012) * dt; e.y += e.vy * dt;
        const k = e.life / e.max, a = Math.sin(Math.PI * k);
        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = k < 0.45 ? "#ffb347" : VOLT; // sparks turn volt as they climb: embers become LIMITLINE's
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1 - k * 0.5), 0, TAU); ctx.fill();
      }
      ctx.restore(); ctx.globalAlpha = 1;

      // II Rise: the march, from all fours to upright, leaving its earlier selves.
      const march = bell(c, 1, 0.95);
      if (march > 0.01) {
        const u = clamp((c - 0.5) / 0.95, 0, 1), s = u * 3, x0 = W * 0.12, x1 = W * 0.84;
        const greys = ["#3a3a37", "#4f4f4b", "#6c6c66"];
        ctx.font = `600 ${Math.max(8, S * 0.075)}px ${family}`; ctx.textAlign = "center";
        try { ctx.letterSpacing = "1px"; } catch (e) { /* older browsers */ }
        for (let kq = 0; kq < 3; kq++) {
          const a = clamp((s - kq - 0.5) * 3, 0, 1) * march;
          if (a <= 0) continue;
          const gx = lerp(x0, x1, kq / 3);
          figure(ctx, pose(stageAt(kq), gx, 0.9, S, G), S, greys[kq], greys[kq], a);
          ctx.globalAlpha = a; ctx.fillStyle = MUTED; ctx.fillText(["6M YRS AGO", "3M YRS AGO", "2M YRS AGO"][kq], gx, G + Math.max(16, S * 0.2)); ctx.globalAlpha = 1;
        }
        try { ctx.letterSpacing = "0px"; } catch (e) { /* older browsers */ }
        const mx = lerp(x0, x1, u);
        figure(ctx, pose(stageAt(s), mx, (mx / S) * 2.3, S, G), S, "#c9c9c2", "#8d8d86", march);
      }

      // III Endurance: a runner at full speed, motion trail, the ground streaming past.
      const run = bell(c, 2, 0.85);
      if (run > 0.01) {
        const u = clamp((c - 1.45) / 1.1, 0, 1), rx = lerp(-S, W + S, u), ph = (rx / S) * 2.6;
        ctx.save(); ctx.globalAlpha = run * 0.35; ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.setLineDash([S * 0.25, S * 0.5]); ctx.lineDashOffset = rx * 1.8;
        for (const yy of [G + S * 0.12, G + S * 0.3]) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
        ctx.restore();
        for (let k = 5; k >= 1; k--) figure(ctx, pose(STAGES[3], rx - k * S * 0.32, ph - k * 0.42, S, G), S, VOLT, "#8fb000", run * 0.09 * (6 - k));
        for (let k = 0; k < 7; k++) { ctx.globalAlpha = run * 0.25; ctx.fillStyle = VOLT; ctx.fillRect(rx - S * (0.9 + k * 0.2), G - S * (0.35 + 0.12 * k), S * (0.4 + (k % 3) * 0.2), 1.2); }
        ctx.globalAlpha = 1;
        ctx.save(); ctx.shadowColor = VOLT; ctx.shadowBlur = 18 * run;
        figure(ctx, pose(STAGES[3], rx, ph, S, G), S, VOLT, "#8fb000", run);
        ctx.restore();
      }

      // V The line: the athlete breaks through the limit line.
      if (lineCh > 0.01) {
        const u = clamp((c - 3.45) / 1.05, 0, 1), lx = W * 0.62, top = G - S * 1.35, cross = 0.55;
        const crossed = u >= cross;
        const ax = u < cross ? lerp(W * 0.14, lx + 4, ease(u / cross)) : lerp(lx + 4, W * 0.82, ease((u - cross) / (1 - cross)));
        const st = u < cross ? 3 : 3 + smooth(cross, 1, u);
        if (crossed) {
          const fl = ctx.createRadialGradient(lx, G, 0, lx, G, W * 0.6);
          fl.addColorStop(0, `rgba(206,255,0,${0.22 * lineCh})`); fl.addColorStop(1, "rgba(206,255,0,0)");
          ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
        }
        ctx.save(); ctx.globalAlpha = lineCh; ctx.strokeStyle = VOLT; ctx.lineWidth = crossed ? 3 : 2;
        if (crossed) { ctx.shadowColor = VOLT; ctx.shadowBlur = 20; } else ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(lx, G + 8); ctx.lineTo(lx, top); ctx.stroke(); ctx.restore();
        ctx.globalAlpha = lineCh; ctx.fillStyle = crossed ? VOLT : MUTED; ctx.font = `700 ${Math.max(8, S * 0.08)}px ${family}`; ctx.textAlign = "center";
        try { ctx.letterSpacing = "2px"; } catch (e) { /* older browsers */ }
        ctx.fillText("YOUR LIMIT", lx, top - 12);
        try { ctx.letterSpacing = "0px"; } catch (e) { /* older browsers */ }
        ctx.globalAlpha = 1;
        const S2 = S * (1 + 0.12 * clamp(st - 3, 0, 1));
        ctx.save(); ctx.shadowColor = VOLT; ctx.shadowBlur = crossed ? 28 : 8;
        figure(ctx, pose(stageAt(st), ax, st >= 3.9 ? 0.5 : (ax / S) * 2.3, S2, G), S2, VOLT, "#8fb000", lineCh);
        ctx.restore();
        if (crossed) {
          const tau = (u - cross) * 2.4;
          ctx.save(); ctx.globalCompositeOperation = "lighter";
          for (const sp of sparks) {
            if (tau > sp.life) continue;
            const k = 1 - tau / sp.life;
            ctx.globalAlpha = k * lineCh; ctx.fillStyle = VOLT;
            ctx.beginPath(); ctx.arc(lx + Math.cos(sp.a) * sp.v * S * tau * 2, G - S * 0.6 + Math.sin(sp.a) * sp.v * S * tau * 2 + S * 2.2 * tau * tau, sp.r * k, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }
      }

      // VI You: the mark draws itself, a line and the blade breaking out of it.
      const you = smooth(4.35, 5, c);
      if (you > 0.01) {
        const sc = Math.min(W, H) * 0.0062, ox = W / 2 - 23 * sc, oy = H * 0.3 - 16 * sc;
        const lineP = smooth(4.4, 4.75, c), bladeP = smooth(4.65, 5, c);
        ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc); ctx.globalAlpha = you;
        ctx.fillStyle = "rgba(244,244,240,0.42)";
        ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(21.2 * lineP, 26); ctx.lineTo(21.2 * lineP - 1.7, 29.5); ctx.lineTo(0, 29.5); ctx.closePath(); ctx.fill();
        if (bladeP > 0) {
          const t = bladeP, tx = lerp(22.8, 38.8, t), ty = lerp(29.5, 1, t);
          ctx.shadowColor = VOLT; ctx.shadowBlur = 30 * t; ctx.fillStyle = VOLT;
          ctx.beginPath(); ctx.moveTo(22.8, 29.5); ctx.lineTo(30, 29.5); ctx.lineTo(tx + 7.2, ty); ctx.lineTo(tx, ty); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        const halo = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, W * 0.7);
        halo.addColorStop(0, `rgba(206,255,0,${0.1 * you})`); halo.addColorStop(1, "rgba(206,255,0,0)");
        ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
      }

      // Film grain and vignette.
      if (grain) { ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H); }
      const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.6)");
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }

    function frame(now) {
      if (!alive) return;
      const dt = last ? Math.min(64, now - last) : 16;
      last = now;
      readScroll();
      // inertia: the scene follows your finger with a little weight
      c = reduced ? target : c + (target - c) * (1 - Math.pow(0.0008, dt / 1000));
      if (Math.abs(target - c) < 0.0005) c = target;
      draw(now, dt);
      opts.onProgress && opts.onProgress(c);
      raf = requestAnimationFrame(frame);
    }
    size();
    const ro = new ResizeObserver(size);
    ro.observe(canvas);
    raf = requestAnimationFrame(frame);
    return { destroy() { alive = false; cancelAnimationFrame(raf); ro.disconnect(); }, progress: () => c };
  }

  window.LimitlineStory = { mount };
})();

</script>
<script>
// ===================== Icons (the real app's set) =====================
const svg = (body, size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const I = {
  // The LIMITLINE mark: a flat line, and a volt blade breaking up out of it.
  logo: (h = 22) => `<svg width="${h * 1.5}" height="${h}" viewBox="0 0 48 32" aria-hidden="true"><path d="M0 26H21.2L19.5 29.5H0Z" fill="#f4f4f0" fill-opacity=".42"/><path d="M22.8 29.5H30L46 1H38.8Z" fill="#ceff00"/></svg>`,
  quests: (f) => svg(`<path d="M3 20l6-9 4 5 3-4 5 8z" fill="${f ? "currentColor" : "none"}"/><path d="M13 9V3l5 2-5 2" fill="${f ? "currentColor" : "none"}"/>`, 28),
  board: (f) => svg(`<path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="${f ? "currentColor" : "none"}"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/><path d="M12 14v3M8 21h8M9 21l1-4h4l1 4"/>`, 28),
  shop: (f) => svg(`<path d="M5 8h14l-1 12H6z" fill="${f ? "currentColor" : "none"}"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/>`, 28),
  flame: (s = 22) => `<span class="flame">${svg(`<path d="M12 22c4 0 7-2.7 7-6.6 0-3.4-2.2-5.6-3.7-7.4-.4 1.7-1.3 2.8-2.5 3.3.3-3.3-1-6.5-3.8-8.3.2 3-1.6 5-3.2 7C4.6 11.5 5 13.2 5 15.4 5 19.3 8 22 12 22z" fill="currentColor" stroke="none"/>`, s)}</span>`,
  ember: (s = 22) => `<span class="ember">${svg(`<path d="M12 3l7 6-7 12-7-12z" fill="currentColor" stroke="none"/><path d="M5 9h14M12 3l-2.5 6L12 21l2.5-12z" stroke="rgb(18 18 18 / 0.35)" stroke-width="1.4"/>`, s)}</span>`,
  run: (s = 26) => svg(`<circle cx="15" cy="4.5" r="2" fill="currentColor" stroke="none"/><path d="M6 12l3-4 4 1 2 4 3 1M13 9l-2 5 3 3-1 4M11 14l-3 2-3-1"/>`, s),
  bike: (s = 26) => svg(`<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2 7h-6M14 6h3"/>`, s),
  swim: (s = 26) => svg(`<circle cx="17" cy="6" r="2" fill="currentColor" stroke="none"/><path d="M4 12l5-3 3 2 3-2"/><path d="M2 17c2 0 2-1.5 4-1.5S8 17 10 17s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 21c2 0 2-1.5 4-1.5S8 21 10 21s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/>`, s),
  hike: (s = 26) => svg(`<circle cx="11" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M10 8l-2 6 3 3-1 4M10 8l3 3 2 1M8 14l-3 6M17 9l-1.5 12"/><path d="M8 8.5L6 13" stroke-width="3"/>`, s),
  ig: (s = 24) => svg(`<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>`, s),
  trophy: (s = 18) => svg(`<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 21h8"/>`, s),
  chev: () => `<span class="chev">${svg(`<path d="M9 5l7 7-7 7"/>`, 20)}</span>`,
  avatar: (s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#3a3a3a"/><circle cx="14" cy="11" r="5" fill="#8a8a85"/><path d="M4.5 23.5a10.5 8 0 0 1 19 0A13.9 13.9 0 0 1 14 28a13.9 13.9 0 0 1-9.5-4.5z" fill="#8a8a85"/></svg>`,
  strava: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.39 17.94l-2.09-4.12h-3.07L15.39 24l5.15-10.18h-3.08" opacity="0.7"/><path d="M10.12 0L3.24 13.82h4.06l2.82-5.57 2.8 5.57h4.03"/></svg>`,

function stravaCheck(q, a) {
  const Q = QUESTS[q], steps = [];

  pass("Your own Strava account");

  pass("Recorded with a watch or phone");
  if (INDOOR[a.type] === Q.sport) return reject("not_outdoor", "Strava says " + a.type + ": indoor");
  if (!TYPES[Q.sport].includes(a.type)) return reject("wrong_sport", a.type === "EBikeRide" ? "E-bike rides don't count" : "It's a " + a.kindLabel + ", not a " + SPORTS[Q.sport].label.toLowerCase());
  if (Q.trail && a.type !== "TrailRun") return reject("not_trail", "Strava says road run, not trail");
  pass("Right sport for " + Q.label);
  if (Q.sport !== "swim" && a.trainer) return reject("not_outdoor", "Marked as indoor on Strava");
  if (Q.sport === "swim" && a.gps) return founder("Has GPS, so it may be open water. Quests are pool swims.");
  pass(Q.sport === "swim" ? "Pool swim" : "Outdoors");
  if (a.at < SIGNED_UP) return reject("before_signup", "Recorded before you signed up");
  pass("Recorded after you signed up");
  let value;
  if (Q.measure === "power") {
    if (a.minutes < 20) return reject("not_completed", a.minutes + " min, short of 20 min");
    pass(a.minutes + " min ride");
    if (!a.power) return reject("needs_power", "No power meter on this ride");
    value = a.best20;
    pass("Best 20 minutes of power: " + value + " W");
  } else if (Q.measure === "elevation") {
    if (a.up < Q.minUp) return reject("not_completed", a.up.toLocaleString("en-GB") + " m up, short of " + Q.minUp.toLocaleString("en-GB") + " m");
    value = a.up;
    pass("Climbed " + a.up.toLocaleString("en-GB") + " m");
  } else {
    if (a.meters < Q.meters - (Q.sport === "swim" ? 1 : 0)) return reject("not_completed", (Q.sport === "swim" ? a.meters + " m" : km(a.meters)) + ", short of " + Q.d);
    pass((Q.sport === "swim" ? a.meters + " m" : km(a.meters)) + ", at least " + Q.d);
    value = a.fastest && a.fastest[Q.meters];
    if (!value) return founder("No fastest " + Q.d + " found in it");
    pass("Fastest " + Q.d + " inside it: " + fmtTime(value));
  }
  const implausible = Q.measure === "time" ? value < Q.plausible : value > Q.plausible;

}

        el.style.setProperty("--ry", (px * max * 1.2).toFixed(2) + "deg");

// Count numbers up (embers, %): used in the result overlay and the Today card.
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach((el) => {
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec || 0), pre = el.dataset.pre || "", suf = el.dataset.suf || "";
    if (reduced) { el.textContent = pre + to.toFixed(dec) + suf; return; }
    const t0 = performance.now(), dur = 900;
    const step = (now) => { const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4); el.textContent = pre + (to * e).toFixed(dec) + suf; if (t < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// Confetti: a short volt burst for a beaten limit.
function confetti(host) {
  if (reduced) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti";
  host.appendChild(cv);
  const r = host.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cols = ["#ceff00", "#f4f4f0", "#8fb000", "#ff9f1a"];
  const ps = Array.from({ length: 90 }, () => ({ x: r.width / 2, y: r.height * 0.42, vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 8, w: 4 + Math.random() * 5, h: 2 + Math.random() * 3, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  const step = (now) => {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, r.width, r.height);
    for (const p of ps) { p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 2.2); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t < 2.2) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

  const apply = () => { mutate(); render(bump); };

}

// ===================== Actions =====================
function parseLink(v) {
  const s = v.trim(), m = s.match(/^https?:\/\/(www\.)?strava\.com\/activities\/(\d{1,20})\/?$/i);
  if (m) return { id: m[2] };
  if (/^https:\/\/strava\.app\.link\/\S+$/i.test(s)) return { short: true };
  return null;
}
const isInstagram = (v) => /^https:\/\/(www\.)?instagram\.com\/(p|reel|reels|stories)\/[\w.\-/]+\/?(\?\S*)?$/i.test(v.trim());
function submitLink(raw) {
  state.linkDraft = raw;
  const p = parseLink(raw);
  if (!p) { state.linkError = "That's not a Strava activity link"; return render(); }
  if (p.short) { state.linkError = "Share links need the real Strava connection. In this demo, tap one of your activities below."; return render(); }
  const a = actById(p.id);
  if (!a) { state.linkError = "That activity isn't in this demo's sample Strava. Tap one of your activities below."; return render(); }
  if (state.entries.find((e) => e.activity === a.id)) { state.linkError = "Already submitted today"; return render(); }
  state.linkError = ""; state.linkDraft = "";
  const id = "e" + Math.random().toString(36).slice(2, 9);
  const entry = { id, quest: state.quest, activity: a.id, status: "waiting", value: null, at: a.at, percent: null, beat: null, embers: 0, seen: false, submitted: Date.now(), by: null };
  state.entries.push(entry);
  if (!state.strava) { state.flash = { text: "Got it! Waiting for the founder's check. Connect Strava to get results in seconds." }; return go(() => { state.tab = "quests"; state.quest = null; }); }
  const before = streak(), r = stravaCheck(state.quest, a);
  let steps = r.steps;
  if (r.kind === "reject") Object.assign(entry, { status: "rejected", reason: r.reason, by: "strava", seen: true });
  else if (r.kind === "founder") entry.note = r.note;
  else {
    const ev = evaluate(state.quest, r.value, a.at, id);
    if (ev.percent !== null && ev.percent > CONFIRM_ABOVE) {
      entry.note = fmtVal(state.quest, r.value) + " is " + fmtPct(ev.percent) + " beyond your limit. The founder double-checks big jumps.";
      steps = [...steps, ["hold", fmtPct(ev.percent) + " beyond your limit: the founder double-checks big jumps"]];
    } else {
      Object.assign(entry, { status: "verified", value: r.value, by: "strava" });
      recomputeAll();
      steps = [...steps, ["pass", ev.percent === null ? "Sets your first limit" : fmtPct(ev.percent) + (ev.beat ? " beyond your limit" : " vs your limit")]];
    }
  }
  const after = streak();
  playChecking(steps, { type: "result", id, streakUp: !before.active && after.active ? after.weeks : 0, party: entry.status === "verified" });
}
function submitPost(raw) {
  state.igDraft = raw;
  if (!isInstagram(raw)) { state.igError = "That's not an Instagram post link. In Instagram: … → Copy link."; return render(); }
  if (state.posts.find((p) => p.link === raw.trim())) { state.igError = "You've already submitted this post"; return render(); }
  const c = contentById(state.content);
  state.posts.push({ id: "p" + Math.random().toString(36).slice(2, 9), cid: c.id, link: raw.trim(), status: "review", embers: c.embers });
  state.igDraft = ""; state.igError = "";
  state.overlay = { type: "posted", cid: c.id };
  render();
}
function playChecking(steps, then) {
  state.overlay = { type: "checking", steps, shown: 0 };
  render();
  const tick = () => {
    if (!state.overlay || state.overlay.type !== "checking") return;
    if (state.overlay.shown < steps.length) { state.overlay.shown += 1; render(); setTimeout(tick, reduced ? 60 : 230); }
    else setTimeout(() => { state.overlay = then; buzz(then.party ? 20 : 8); render(true); }, reduced ? 100 : 420);
  };
  setTimeout(tick, reduced ? 50 : 360);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case "skip": { const s = document.getElementById("story"); s && s.scrollTo({ top: s.scrollHeight, behavior: reduced ? "auto" : "smooth" }); break; }
    case "login": buzz(); state.screen = state.name ? "app" : "welcome"; render(); break;
    case "tab": buzz(5); go(() => Object.assign(state, { tab: v, flash: null, linkError: "", igError: "", quest: null, content: null })); break;
    case "seg": buzz(5); go(() => { state.seg = v; state.flash = null; }); break;
    case "filter": buzz(5); state.filter = v; render(); break;
    case "quest": buzz(6); go(() => Object.assign(state, { tab: "quest", quest: v, flash: null, linkError: "", linkDraft: "", showOther: false })); break;
    case "content": buzz(6); go(() => Object.assign(state, { tab: "content", content: v, flash: null, igError: "", igDraft: "" })); break;
    case "pick": buzz(5); state.linkDraft = "https://www.strava.com/activities/" + v; state.linkError = ""; render(); document.getElementById("link-form")?.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }); break;
    case "other": state.showOther = !state.showOther; render(); break;
    case "igsample": state.igDraft = "https://www.instagram.com/reel/C" + Math.random().toString(36).slice(2, 11) + "/"; state.igError = ""; render(); break;
    case "allseen": state.entries.forEach((e) => { e.seen = true; }); render(); break;
    case "seen": { const e = state.entries.find((x) => x.id === v); if (e) e.seen = true; render(); break; }
    case "share": state.overlay = { type: "share", id: v }; render(); break;
    case "close": state.overlay = null; render(); break;
    case "close-posted": state.overlay = null; go(() => Object.assign(state, { tab: "quests", seg: "content", content: null, flash: null }), true); break;
    case "continue": {
      const e = state.entries.find((x) => x.id === state.overlay.id);
      state.overlay = null;
      state.flash = e.status === "verified" ? null : e.status === "rejected" ? { tone: "badn", text: "Checked with Strava: not approved. " + REASONS[e.reason] + "." } : { text: "This one needs a quick check by the founder." };
      go(() => Object.assign(state, { tab: "quests", quest: null, seg: "training" }), true); break;
    }
    case "sport": buzz(5); state.sport = v; lastKey = ""; render(); break;
    case "redeem": {
      const item = SHOP.find((i) => i.id === v);
      if (balance() >= item.price && state.stock[v] > 0) { buzz(15); state.stock[v] -= 1; state.redemptions.push({ id: v, name: item.name, price: item.price }); state.flash = { where: "shop", text: "Requested! " + (item.sponsor ? SPONSORS[item.sponsor].name + " ships it to you." : "The founder will hand it over.") }; }
      render(true); break;
    }
    case "strava": state.strava = v === "on"; render(); break;
    case "approve": { const e = state.entries.find((x) => x.id === v), fv = founderValue(e); Object.assign(e, { status: "verified", value: fv.value, by: "founder", seen: false, note: null }); recomputeAll(); go(() => Object.assign(state, { tab: "quests", seg: "training", flash: { text: "Approved by the founder. Your result is below." } }), true); break; }
    case "reject": { const e = state.entries.find((x) => x.id === v), fv = founderValue(e); Object.assign(e, { status: "rejected", reason: fv.reason || "not_completed", by: "founder" }); recomputeAll(); render(); break; }
    case "papprove": { const p = state.posts.find((x) => x.id === v); p.status = "approved"; go(() => Object.assign(state, { tab: "quests", seg: "content", flash: { text: "Post approved: +" + p.embers + " embers." } }), true); break; }
    case "preject": { const p = state.posts.find((x) => x.id === v); p.status = "rejected"; p.reason = "no_tag"; render(); break; }
    case "reset": try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } freshState(); render(); break;
    case "logout": state.screen = "landing"; state.tab = "quests"; render(); break;
  }
});
document.addEventListener("change", (ev) => { const el = ev.target; if (el.dataset && el.dataset.act === "toggle") { buzz(5); state[el.dataset.v] = el.checked; save(); } });
document.addEventListener("input", (ev) => { if (ev.target.id === "link") state.linkDraft = ev.target.value; if (ev.target.id === "ig") state.igDraft = ev.target.value; });
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "welcome-form") { state.name = document.getElementById("name").value.trim().slice(0, 40) || "Alex M."; Object.assign(state, { screen: "app", tab: "quests" }); render(); }
  if (ev.target.id === "link-form") submitLink(document.getElementById("link").value);
  if (ev.target.id === "ig-form") submitPost(document.getElementById("ig").value);
});

function start(data) {
  state = (data && data.state) || load() || freshState();
  if (state.overlay && state.overlay.type === "checking") state.overlay = null;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state: { ...state, overlay: state.overlay && state.overlay.type === "checking" ? null : state.overlay } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
