<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIMITLINE Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#050505}canvas{display:block;max-height:100vh;max-width:100vw;margin:auto;aspect-ratio:9/16}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<!-- Open as player.html?r=02-beginner-beats-pro to play a reel live. Add &export to stop the loop. -->
<script src="shared/common.js"></script>
<script>
const q = new URLSearchParams(location.search), dir = q.get("r");
const ctx = document.getElementById("c").getContext("2d");
const FF = "Archivo, Inter, sans-serif";
window.ready = new Promise((res) => {
  const s = document.createElement("script"); s.src = dir + "/reel.js";
  s.onload = () => Promise.all([document.fonts.load("900 80px Archivo"), document.fonts.ready]).then(() => res(true));
  document.body.appendChild(s);
});
window.renderAt = (t) => window.Reel.render(ctx, t, FF);
window.ready.then(() => {
  if (q.has("export")) return;
  const t0 = performance.now();
  const loop = (now) => { renderAt(((now - t0) / 1000) % window.Reel.DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script></body></html>
